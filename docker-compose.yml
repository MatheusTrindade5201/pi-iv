services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pi_iv
      POSTGRES_PASSWORD: pi_iv
      POSTGRES_DB: pi_iv
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_iv -d pi_iv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
